services:
  db:
    image: mysql:8.0
    container_name: pet-house-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pet_house_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d

  influxdb:
    image: influxdb:2.7
    container_name: pet-house-influxdb
    restart: always
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./influx-init:/docker-entrypoint-initdb.d
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      DOCKER_INFLUXDB_INIT_CLI_CONFIG_NAME: pethouse-config

  emqx:
    image: emqx/emqx:5.8
    container_name: pet-house-emqx
    restart: always
    ports:
      - "1883:1883"       # MQTT TCP
      - "8083:8083"       # MQTT WebSocket
      - "8883:8883"       # MQTT SSL
      - "18083:18083"     # EMQX Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    environment:
      EMQX_NAME: pet-house-emqx
      EMQX_LISTENERS__TCP__DEFAULT__ACCEPTORS: 8
      EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS: 1024000

  app:
    image: 720546261301.dkr.ecr.ap-northeast-2.amazonaws.com/pet-house-app:latest
    container_name: pet-house-app
    ports:
      - "8081:8080"
    depends_on:
      - db
      - emqx
      - influxdb
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/pet_house_db?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      KAFKA_BROKER_URL: kafka:9092    # Docker 내부 → kafka:9092 사용
      TZ: Asia/Seoul
      SERVER_PORT: 8080

  ngrinder-controller:
    image: ngrinder/controller:latest
    container_name: ngrinder-controller
    restart: always
    ports:
      - "8090:80"
      - "16001:16001"
      - "12000-12009:12000-12009"
    volumes:
      - ngrinder_controller_data:/opt/ngrinder-controller

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pet-house-kafka
    restart: always
    ports:
      - "9094:9094"    # 로컬(외부) 접속용
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

  ngrinder-agent:
    image: ngrinder/agent:latest
    container_name: ngrinder-agent
    restart: always
    depends_on:
      - ngrinder-controller
    environment:
      - GRINDER_AGENT_CONTROLLER_HOST=ngrinder-controller
      - GRINDER_AGENT_CONTROLLER_PORT=16001

volumes:
  mysql_data:
  emqx_data:
  emqx_log:
  influxdb_data:
  ngrinder_controller_data:
  kafka_data: